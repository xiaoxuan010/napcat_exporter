rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - name: offline to unknown to exporter down preserves pending and online resolves
    interval: 15s
    input_series:
      - series: 'up{job="napcat",instance="test:18599"}'
        values: '1 1 1 1 1 1 0 0 1 1'
      - series: 'napcat_api_up{job="napcat",instance="test:18599",action="get_status"}'
        values: '1 1 0 0 0 0 stale _ 1 1'
      - series: 'napcat_online{job="napcat",instance="test:18599"}'
        values: '1 0 stale _ _ _ _ _ 1 1'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 60s
        exp_samples: []
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 75s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 105s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: ALERTS
        eval_time: 120s
        exp_samples: []
  - name: initial upstream failure is covered without a last-success sample
    interval: 15s
    input_series:
      - series: 'up{job="napcat",instance="test:18599"}'
        values: '1+0x5'
      - series: 'napcat_api_up{job="napcat",instance="test:18599",action="get_status"}'
        values: '0+0x5'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 60s
        exp_samples:
          - labels: '{}'
            value: 1
