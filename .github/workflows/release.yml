name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: tools
        run: cat .github/tool-versions.env >> "$GITHUB_OUTPUT"
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ steps.tools.outputs.GOVULNCHECK_VERSION }} ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.tools.outputs.GORELEASER_VERSION }}
          args: release --clean --skip=publish,announce
      - name: Verify final release package
        run: |
          go test -c -o "$RUNNER_TEMP/package-acceptance" ./internal/acceptance
          package=$(find "$PWD/dist" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          sudo env NAPCAT_DEB="$package" "$RUNNER_TEMP/package-acceptance" -test.v -test.run '^TestPackageLifecycle$'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/checksums.txt --verify-tag --generate-notes
          fi
